# =====================================================================
# CRM Odontológico - Despliegue
# backend (Spring Boot 3 + Java 21) · frontend (nginx) · postgres · redis · openwa
# =====================================================================

name: dentalcrm

services:
  postgres:
    image: postgres:17-alpine
    command: postgres -c port=5433
    container_name: dentalcrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-dentalcrm}
      POSTGRES_USER: ${DATABASE_USERNAME:-dentalcrm}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dentalcrm}
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U ${DATABASE_USERNAME:-dentalcrm} -d ${DATABASE_NAME:-dentalcrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dentalcrm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    container_name: dentalcrm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5433/${DATABASE_NAME:-dentalcrm}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-dentalcrm}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dentalcrm}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SERVER_PORT: 8080
      TIMEZONE: ${TIMEZONE:-America/Guayaquil}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      OPENWA_URL: ${OPENWA_URL:-http://openwa:2785}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_WEBHOOK_URL: ${OPENWA_WEBHOOK_URL:-http://backend:8080/api/v1/webhooks/whatsapp}
      OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/google/callback}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: dentalcrm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      # Opcional: exponer también el backend vía nginx (api ya proxy a backend:8080)

  openwa:
    image: rmyndharis/openwa:0.23.4
    container_name: dentalcrm-openwa
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "2785"
      SERVE_DASHBOARD: "true"
      ENABLE_SWAGGER: "false"
      API_MASTER_KEY: ${OPENWA_API_KEY:?OPENWA_API_KEY es obligatorio}
      ENGINE_TYPE: baileys
      AUTO_START_SESSIONS: "true"
      WEBHOOK_SSRF_PROTECT: "true"
      # El webhook apunta al backend dentro de la red de compose; se permite su hostname.
      SSRF_ALLOWED_HOSTS: backend
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      # Dashboard accesible sobre HTTP local
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
      WEBHOOK_SHUTDOWN_DRAIN_MS: "12000"
    ports:
      - "2785:2785"
    volumes:
      - openwa_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:2785/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  openwa_data: