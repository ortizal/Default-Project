<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Little Smile CRM</title>
  <base href="/dental_crm/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Tema aplicado antes del primer pintado (sin parpadeo). Deja SIEMPRE una
    // clase en <html>: la guardada por el usuario o la del sistema, que sigue
    // los cambios de prefers-color-scheme mientras no haya elección propia.
    (function () {
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var guardado = localStorage.getItem('ls-theme');
        var aplicar = function (tema) {
          var c = document.documentElement.classList;
          c.remove('theme-dark', 'theme-light');
          c.add('theme-' + tema);
        };
        aplicar(guardado === 'dark' || guardado === 'light' ? guardado : mq.matches ? 'dark' : 'light');
        if (guardado !== 'dark' && guardado !== 'light') {
          mq.addEventListener('change', function (e) {
            aplicar(e.matches ? 'dark' : 'light');
          });
        }
      } catch (e) {
        /* sin almacenamiento/matchMedia: queda el tema claro por defecto */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
