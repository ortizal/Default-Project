<div class="app-shell">
  <app-sidebar
    [colapsado]="colapsado()"
    [abierto]="abierto()"
    (salir)="salir()"
    (navegar)="cerrarMenu()"
  />
  @if (abierto()) {
    <div role="presentation" class="sidebar-backdrop" (click)="cerrarMenu()"></div>
  }
  <div class="main">
    <app-header
      [colapsado]="colapsado()"
      [abierto]="abierto()"
      [titulo]="titulo"
      [fecha]="fecha"
      (alternarMenu)="alternar()"
      (salir)="salir()"
    />
    <main class="content">
      <div class="content-wrapper">
        <router-outlet />
      </div>
    </main>
    <app-footer />
  </div>
</div>
