<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">🦷</span>
    </div>
    <h1>CRM Dental</h1>
    <div class="sub">Inicia sesión para continuar</div>
    @if (error) {
      <div class="msg error">{{ error }}</div>
    }
    <form (ngSubmit)="entrar()">
      <label class="label">Usuario</label>
      <input class="input" type="text" [(ngModel)]="username" name="username" autocomplete="username" required placeholder="Tu usuario" />
      <label class="label">Contraseña</label>
      <div class="password-wrapper">
        <input class="input" [type]="mostrarContrasena ? 'text' : 'password'" [(ngModel)]="password" name="password" autocomplete="current-password" required placeholder="Tu contraseña" />
        <button type="button" class="toggle-password" (click)="mostrarContrasena = !mostrarContrasena" title="Mostrar contraseña">
          @if (mostrarContrasena) {
            <span class="eye-off">👁️</span>
          } @else {
            <span class="eye">👁️</span>
          }
        </button>
      </div>
      <div class="login-footer">
        <label class="remember">
          <input type="checkbox" /> Recordarme
        </label>
        <a class="forgot-link" href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <div style="margin-top:20px">
        <button class="btn primary" style="width:100%" [disabled]="cargando">
          @if (cargando) {
            <span class="spin"></span>
          } @else {
            Entrar
          }
        </button>
      </div>
    </form>
    <div class="login-footer-bottom">
      <span>© 2026 CRM Dental</span>
    </div>
  </div>
</div>
