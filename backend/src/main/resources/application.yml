spring:
  application:
    name: dental-crm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/dentalcrm}
    username: ${DATABASE_USERNAME:dentalcrm}
    password: ${DATABASE_PASSWORD:dentalcrm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: ${TIMEZONE:America/Guayaquil}
        format_sql: true
        tenant_identifier_resolver: org.dentalcrm.multitenant.TenantIdentifierResolver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
    time-zone: ${TIMEZONE:America/Guayaquil}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  timezone: ${TIMEZONE:America/Guayaquil}
  clinica:
    nombre: ${CLINICA_NOMBRE:Clínica Dental}
    direccion: ${CLINICA_DIRECCION:}
    telefono: ${CLINICA_TELEFONO:}
  mail:
    # SMTP opcional. Sin host no se manda correo: sólo se notifica por WhatsApp.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
  openwa:
    url: ${OPENWA_URL:http://localhost:2785}
    api-key: ${OPENWA_API_KEY:}
    timeout-seconds: ${OPENWA_TIMEOUT_SECONDS:10}
    webhook-url: ${OPENWA_WEBHOOK_URL:http://localhost:8080/api/v1/webhooks/whatsapp}
    webhook-secret: ${OPENWA_WEBHOOK_SECRET:}
    recuperacion:
      ventana-horas: ${WHATSAPP_RECUPERACION_VENTANA_HORAS:48}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/google/callback}
    auth-base-url: ${GOOGLE_AUTH_BASE_URL:https://accounts.google.com}
    oauth-base-url: ${GOOGLE_OAUTH_BASE_URL:https://oauth2.googleapis.com}
    api-base-url: ${GOOGLE_API_BASE_URL:https://www.googleapis.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html

logging:
  level:
    org.dentalcrm: DEBUG
    org.hibernate.SQL: WARN